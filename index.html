<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bike Taxi Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="map"></div>

  <div class="top-panel">
    <h2>🏍️ Bike Taxi</h2>
    <p id="status">Pickup location select करें</p>
  </div>
<div class="ride-card" id="rideCard">

  <div class="ride-header">
    <span>🚕 New Ride</span>
    <span id="rideStatus">Waiting</span>
  </div>

  <div class="passenger">
    <div class="passenger-avatar">👤</div>

    <div>
      <h3>Rahul</h3>
      <p>⭐ 4.8 • Passenger</p>
    </div>
  </div>

  <div class="ride-info">
    <div>
      <small>Distance</small>
      <strong id="distanceText">-- km</strong>
    </div>

    <div>
      <small>Fare</small>
      <strong id="fareText">₹--</strong>
    </div>

    <div>
      <small>Time</small>
      <strong id="timeText">-- min</strong>
    </div>
  </div>

  <button id="acceptRideBtn">
    ✅ Accept Ride
  </button>
<div class="progress-box">
  <div class="progress-text">
    <span>Ride Progress</span>
    <strong id="progressPercent">0%</strong>
  </div>

  <div class="progress-bar">
    <div id="progressFill"></div>
  </div>
</div>

<div class="wallet">
  💰 Wallet: ₹<span id="walletAmount">0</span>
</div>

<button id="nextRideBtn" class="next-ride-btn" hidden>
  🔄 Next Ride
</button>
</div>
  <div class="bottom-panel">
    <button id="pickupBtn">📍 Set Pickup</button>
    <button id="destinationBtn">🏁 Set Destination</button>
    <button id="startRideBtn" disabled>
  🏍️ Start Ride
    </button>
  </div>
<div class="driving-controls">

  <button id="leftBtn">◀️</button>

  <button id="brakeBtn">🛑</button>

  <button id="accelerateBtn">⬆️</button>

  <button id="rightBtn">▶️</button>

</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

</body>
</html>
